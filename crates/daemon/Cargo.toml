[package]
name = "wavectld"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
wavectl-core = { path = "../core" }
pipewire = "0.10"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
